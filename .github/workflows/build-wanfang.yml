name: Build Wanfang Remote Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  LLVM_VERSION: "15.0.6"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  # ============ Job 1: 生成 flutter-rust-bridge 代码（Ubuntu 更快）============
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply hbb_common customization (built-in server/key/brand)
        shell: bash
        run: |
          cd libs/hbb_common
          git apply ../../.github/patches/hbb_common_custom.patch
          grep -n "noqy+fPo5k83gfriL3tT2dHUKYNSFZ4ZFx9IE10Nw+s=" src/config.rs | head -3

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install Flutter ${{ env.BRIDGE_FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install bridge codegen tools
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # 3.22.3 需要降级 extended_text（照搬官方）
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Fix brand name in generated bridge
        shell: bash
        run: |
          sed -i 's/mainGetAppNameSync(hint: hint) != "RustDesk"/mainGetAppNameSync(hint: hint) != "万方远控"/g' flutter/lib/generated_bridge.dart 2>/dev/null || true
          sed -i 's/checks if app name is not "RustDesk"/checks if app name is not "万方远控"/g' flutter/lib/generated_bridge.dart 2>/dev/null || true
          grep -n 'isCustomClient' -A3 flutter/lib/generated_bridge.dart | head -8 || true

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h

  # ============ Job 2: 编译 Windows x64 客户端 ============
  build-windows:
    name: Build Windows x64
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export cache env
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply hbb_common customization (built-in server/key/brand)
        shell: bash
        run: |
          cd libs/hbb_common
          git apply ../../.github/patches/hbb_common_custom.patch
          grep -n "noqy+fPo5k83gfriL3tT2dHUKYNSFZ4ZFx9IE10Nw+s=" src/config.rs | head -3

      - name: Download bridge artifacts
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release"
          mv -Force windows-x64-release/* $engineDir

      - name: Patch flutter (dropdown filter)
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "=== $f ==="; tail -50 "$f"; done
            exit 1
          fi

      - name: Build client
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          New-Item -ItemType Directory -Force -Path .\output | Out-Null
          Copy-Item -Recurse -Force .\flutter\build\windows\x64\runner\Release\* .\output\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wanfang-remote-windows-x64
          path: output
          retention-days: 30
